name: Build and playtest
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
      - run: npm run media
      - run: sudo apt-get install -y ffmpeg
      - run: node scripts/record.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ricochet-foundry-verification
          path: |
            docs/browser-test-report.json
            submission/
          retention-days: 30
